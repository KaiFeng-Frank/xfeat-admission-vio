%YAML:1.0

model_type: PINHOLE
camera_name: kaist_official_distortion
image_width: 640
image_height: 480
distortion_parameters:
   k1: 0.006896928127777268
   k2: -0.009144207062654397
   p1: 0.000254113977103925
   p2: 0.0021434982252719545
projection_parameters:
   fx: 380.9229090195708
   fy: 380.29264802262736
   cx: 324.68121181846755
   cy: 224.6741321466431

# Topics 
imu_topic: "/d400/imu"
image_topic: "/d400/color/image"
dpt_img_topic: "/d400/aligned_depth/image"
output_path: "${EXTERNAL_ROOT}/g120_cross_dataset_v4_20260902/kaist/runs/off/rotation_fast"

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

body_T_cam0: !!opencv-matrix # KAIST imu_T_infra1, inverse of published T_cam_imu
   rows: 4
   cols: 4
   dt: d
   data: [-0.040301240, 0.026311325, 0.998841091, 0.138044477,
      -0.998999876, -0.020436500, -0.039769311, 0.014814826,
      0.019366432, -0.999444878, 0.027108627, -0.034914942,
      0, 0, 0, 1]

# camera                     # IMU
#       /z                    | x
#      /                      |
#     /____x             y____|
#     |                       /
#     |                      /
#     | y                   / z

body_T_cam1: !!opencv-matrix # same frozen virtual +0.1 m cam-x transform applied to KAIST cam0
   rows: 4
   cols: 4
   dt: d
   data: [-0.040301240, 0.026311325, 0.998841091, 0.134014353,
      -0.998999876, -0.020436500, -0.039769311, -0.085085162,
      0.019366432, -0.999444878, 0.027108627, -0.032978299,
      0, 0, 0, 1]


# Multiple thread support
multiple_thread: 1

# Feature traker paprameters
max_cnt: 150            # max feature number in feature tracking
min_dist: 20            # frozen admission-only live-track spacing
freq_gate: 0            # Phase2 default is full-rate; set 1 only for the independent frequency experiment
freq: 10                # target Hz when freq_gate is enabled
F_threshold: 2.0        # ransac threshold (pixel)
show_track: 0           # sandbox sidecar run: no visualization overhead
flow_back: 0            # Phase2 corrected baseline is forward-only

# IMU acc. multiply
acc_mult: 1

# Optimization parameters
max_solver_time: 0.04   # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 20.0 #10.0 # keyframe selection threshold (pixel)

# Imu parameters     The more accurate parameters you provide, the better performance
acc_n: 0.1       # accelerometer measurement noise standard deviation. 
gyr_n: 0.01      # gyroscope measurement noise standard deviation.     
acc_w: 0.001     # accelerometer bias random work noise standard deviation.  
gyr_w: 0.0001    # gyroscope bias random work noise standard deviation.     
g_norm: 9.81     # gravity magnitude

# Loop closure
loop_closure: 0   #if you want to use loop closure to minimize the drift, set loop_closure true and give your brief pattern file path and vocabulary file path accordingly;
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "" # save and load path
save_image: 0 #1     

# Unsynchronization parameters
estimate_td: 0                      # online estimate time offset between camera and imu
td: 0.0                             # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

# Rolling shutter parameters
rolling_shutter: 0                      # 0: global shutter camera, 1: rolling shutter camera
rolling_shutter_tr: 0.0               # unit: s. rolling shutter read out time per frame (from data sheet). 
   
# RGBD camera Ideal Range
depth_min_dist: 0.3
depth_max_dist: 4.0

# Structural constraints
horizontal_structural_th: 5.0
line_horizontal_structural_th: 5.0
vertical_structural_th: 3.0

# Outlier threshold
err_pt_line: 10 
err_normal_line: 10 
err_point: 20
err_plane_dist: 1.0

# Result format
save_tum: 0

# Drop frame
drop_frame: 0

# Min used num (line/point)
min_used_num: 4

# ablation study
structure_verify: 1
use_gmm: 1
use_gmm_ext: 1
disable_line: 0
disable_plane: 0
structure: 1
